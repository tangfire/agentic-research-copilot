<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Research Copilot · Agent Workbench</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --ink: #152033;
      --muted: #647084;
      --line: #d9e0ea;
      --surface: #ffffff;
      --soft: #eef3f7;
      --accent: #0f766e;
      --accent-strong: #0b5d56;
      --warn: #a16207;
      --bad: #b91c1c;
      --good: #15803d;
      --shadow: 0 14px 32px rgba(21, 32, 51, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button.danger {
      border-color: #fecaca;
      color: var(--bad);
      background: #fff7f7;
    }

    button.compact {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      min-height: 62px;
      padding: 12px clamp(14px, 3vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand strong {
      font-size: 17px;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .layout {
      width: min(1580px, 100%);
      margin: 0 auto;
      padding: 18px clamp(12px, 3vw, 28px) 28px;
      display: grid;
      grid-template-columns: 260px minmax(0, 1fr) 380px;
      gap: 16px;
      min-height: calc(100vh - 62px);
    }

    .panel {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .side,
    .chat,
    .inspector {
      min-height: 0;
      overflow: hidden;
    }

    .side {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .chat {
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .inspector {
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .panel-head {
      min-height: 54px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .session-list,
    .timeline,
    .inspector-body {
      overflow: auto;
    }

    .session-list {
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .session-row {
      width: 100%;
      display: grid;
      gap: 5px;
      text-align: left;
      border-color: transparent;
      background: #f8fafc;
      min-height: 68px;
      white-space: normal;
      justify-content: stretch;
    }

    .session-row.active {
      border-color: #9bd2ca;
      background: #edf9f6;
    }

    .session-row strong,
    .session-row span {
      overflow-wrap: anywhere;
    }

    .session-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .status-strip {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      background: #f8fafc;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .pill.good {
      color: var(--good);
      background: #e9f7ee;
    }

    .pill.warn {
      color: var(--warn);
      background: #fff7e6;
    }

    .pill.bad {
      color: var(--bad);
      background: #fef2f2;
    }

    .timeline {
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .message {
      width: min(760px, 92%);
      display: grid;
      gap: 7px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .message.user {
      justify-self: end;
      background: #eef6ff;
      border-color: #c8ddff;
    }

    .message.assistant {
      justify-self: start;
    }

    .message header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .message pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: inherit;
      line-height: 1.55;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 10px;
      background: #fff;
    }

    .composer textarea {
      min-height: 90px;
      resize: vertical;
    }

    .composer-actions,
    .settings {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .composer-actions {
      justify-content: space-between;
    }

    .settings select,
    .settings input {
      width: auto;
      min-width: 94px;
    }

    .inspector-body {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .block {
      display: grid;
      gap: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .block h3 {
      margin: 0;
      font-size: 14px;
    }

    .block p,
    .block li {
      color: #2a3547;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .block p,
    .block ul,
    .block ol {
      margin: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #f8fafc;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 3px;
    }

    .memory-form,
    .workspace-form {
      display: grid;
      gap: 8px;
    }

    .workspace-form textarea {
      min-height: 70px;
      resize: vertical;
    }

    .memory-row,
    .source-row,
    .trace-row,
    .step-row,
    .tool-row,
    .approval-row,
    .coverage-row,
    .extraction-row,
    .quality-row {
      display: grid;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .memory-row:last-child,
    .source-row:last-child,
    .trace-row:last-child,
    .step-row:last-child,
    .tool-row:last-child,
    .approval-row:last-child,
    .coverage-row:last-child,
    .extraction-row:last-child,
    .quality-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .row-head strong,
    .row-head span,
    .tool-row span,
    .step-row span,
    .approval-row span,
    .coverage-row span,
    .extraction-row span,
    .quality-row span {
      overflow-wrap: anywhere;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
    }

    .report {
      display: grid;
      gap: 12px;
    }

    .report-section {
      display: grid;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px solid var(--line);
    }

    .empty {
      color: var(--muted);
      background: #f8fafc;
      border: 1px dashed #cfd8e3;
      border-radius: 8px;
      padding: 14px;
      line-height: 1.5;
    }

    .error {
      color: var(--bad);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 230px minmax(0, 1fr);
      }

      .inspector {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 820px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .side {
        min-height: 220px;
      }

      .message {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>AI Research Copilot</strong>
        <span>Conversational research agent with memory, planning, tools, trace, and evaluation</span>
      </div>
      <div class="settings">
        <a class="pill" href="/docs">API Docs</a>
        <a class="pill" href="/v1/research/runs">/v1/research/runs</a>
        <button id="exportBtn" class="compact" title="Export active session" disabled>Export</button>
        <span id="apiStatus" class="pill warn">checking</span>
      </div>
    </header>

    <div class="layout">
      <aside class="panel side">
        <div class="panel-head">
          <h2>Sessions</h2>
          <button id="newSessionBtn" title="New session">New</button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </aside>

      <section class="panel chat">
        <div class="status-strip">
          <span id="sessionStatus" class="pill">no session</span>
          <span id="workspaceStatus" class="pill">workspace unknown</span>
          <span id="skillStatus" class="pill">skill unknown</span>
          <span id="mcpStatus" class="pill">MCP unknown</span>
          <span id="jobStatus" class="pill">no job</span>
        </div>
        <div id="timeline" class="timeline"></div>
        <div class="composer">
          <textarea id="messageInput" placeholder="输入研究目标、团队约束或补充信息"></textarea>
          <div class="composer-actions">
            <div class="settings">
              <select id="depthSelect" title="Depth">
                <option value="quick">quick</option>
                <option value="standard" selected>standard</option>
                <option value="deep">deep</option>
              </select>
              <input id="maxSectionsInput" type="number" min="1" max="8" value="4" title="Max sections" />
            </div>
            <div class="settings">
              <button id="confirmBtn" class="primary" disabled>确认并开始研究</button>
              <button id="sendBtn" class="primary">开始研究</button>
            </div>
          </div>
        </div>
      </section>

      <aside class="panel inspector">
        <div class="panel-head">
          <h2>Inspector</h2>
          <button id="refreshBtn" title="Refresh">Refresh</button>
        </div>
        <div id="inspector" class="inspector-body"></div>
      </aside>
    </div>
  </div>

  <script>
    const state = {
      sessions: [],
      workspaces: [],
      activeSessionId: null,
      activeWorkspaceId: null,
      bundle: null,
      pollTimer: null,
    };

    const el = {
      apiStatus: document.getElementById("apiStatus"),
      sessionList: document.getElementById("sessionList"),
      timeline: document.getElementById("timeline"),
      inspector: document.getElementById("inspector"),
      sessionStatus: document.getElementById("sessionStatus"),
      workspaceStatus: document.getElementById("workspaceStatus"),
      skillStatus: document.getElementById("skillStatus"),
      mcpStatus: document.getElementById("mcpStatus"),
      jobStatus: document.getElementById("jobStatus"),
      messageInput: document.getElementById("messageInput"),
      depthSelect: document.getElementById("depthSelect"),
      maxSectionsInput: document.getElementById("maxSectionsInput"),
      sendBtn: document.getElementById("sendBtn"),
      confirmBtn: document.getElementById("confirmBtn"),
      newSessionBtn: document.getElementById("newSessionBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      exportBtn: document.getElementById("exportBtn"),
    };

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          detail = (await response.json()).detail || detail;
        } catch (_) {
          detail = response.statusText;
        }
        throw new Error(detail);
      }
      return response.json();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function short(value, limit = 90) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text.length > limit ? `${text.slice(0, limit - 3)}...` : text;
    }

    async function loadWorkspaces() {
      state.workspaces = await api("/v1/agent/workspaces");
      if (!state.activeWorkspaceId && state.workspaces.length) {
        state.activeWorkspaceId = state.workspaces[0].workspace_id;
      }
    }

    async function loadSessions() {
      await loadWorkspaces();
      state.sessions = await api("/v1/agent/sessions");
      if (!state.activeSessionId && state.sessions.length) {
        state.activeSessionId = state.sessions[0].session_id;
      }
      if (!state.activeWorkspaceId && state.sessions.length && state.sessions[0].workspace_id) {
        state.activeWorkspaceId = state.sessions[0].workspace_id;
      }
      renderSessions();
      if (state.activeSessionId) {
        await loadBundle(state.activeSessionId);
      } else {
        renderAll();
      }
    }

    async function loadBundle(sessionId) {
      state.bundle = await api(`/v1/agent/sessions/${sessionId}`);
      state.activeSessionId = sessionId;
      if (state.bundle.workspace && state.bundle.workspace.workspace_id) {
        state.activeWorkspaceId = state.bundle.workspace.workspace_id;
      }
      renderAll();
      syncPolling();
    }

    function renderSessions() {
      if (!state.sessions.length) {
        el.sessionList.innerHTML = '<div class="empty">No sessions yet.</div>';
        return;
      }
      const workspaceMap = new Map((state.workspaces || []).map((workspace) => [workspace.workspace_id, workspace]));
      el.sessionList.innerHTML = state.sessions.map((session) => `
        <button class="session-row ${session.session_id === state.activeSessionId ? "active" : ""}" data-session="${session.session_id}">
          <strong>${escapeHtml(session.title)}</strong>
          <span>${escapeHtml(session.status)} · ${escapeHtml(workspaceMap.get(session.workspace_id || "")?.name || session.workspace_id || "default workspace")} · ${escapeHtml(short(session.updated_at, 28))}</span>
        </button>
      `).join("");
      el.sessionList.querySelectorAll("[data-session]").forEach((button) => {
        button.addEventListener("click", () => loadBundle(button.dataset.session));
      });
    }

    function renderAll() {
      const bundle = state.bundle;
      renderStatus(bundle);
      renderTimeline(bundle);
      renderInspector(bundle);
    }

    function renderStatus(bundle) {
      if (!bundle) {
        el.sessionStatus.textContent = "no session";
        el.sessionStatus.className = "pill";
        el.workspaceStatus.textContent = "workspace unknown";
        el.workspaceStatus.className = "pill";
        el.skillStatus.textContent = "skill unknown";
        el.skillStatus.className = "pill";
        el.mcpStatus.textContent = "MCP unknown";
        el.jobStatus.textContent = "no job";
        el.confirmBtn.disabled = true;
        el.exportBtn.disabled = true;
        return;
      }
      const status = bundle.session.status;
      el.sessionStatus.textContent = status;
      el.sessionStatus.className = `pill ${status === "completed" ? "good" : status === "failed" ? "bad" : "warn"}`;
      const mcp = bundle.mcp_status || {};
      el.mcpStatus.textContent = mcp.label || (mcp.available ? "MCP available" : "MCP not configured");
      el.mcpStatus.className = `pill ${mcp.available ? "good" : "warn"}`;
      const workspace = bundle.workspace || {};
      el.workspaceStatus.textContent = workspace.name || workspace.workspace_id || "workspace unknown";
      el.workspaceStatus.className = `pill ${workspace.name ? "good" : ""}`;
      const skill = bundle.selected_skill || {};
      el.skillStatus.textContent = skill.name || skill.skill_id || "skill unknown";
      el.skillStatus.className = `pill ${skill.name ? "good" : ""}`;
      const job = bundle.active_job;
      el.jobStatus.textContent = job ? `${job.status} · ${short(job.job_id, 10)}` : "no job";
      el.jobStatus.className = `pill ${job && job.status === "completed" ? "good" : job && job.status === "failed" ? "bad" : ""}`;
      el.confirmBtn.disabled = status !== "awaiting_confirmation" || !bundle.plan_draft;
      el.exportBtn.disabled = false;
    }

    function renderTimeline(bundle) {
      if (!bundle) {
        el.timeline.innerHTML = '<div class="empty">Create a session to start.</div>';
        return;
      }
      if (!bundle.messages.length) {
        el.timeline.innerHTML = '<div class="empty">Send a research goal or team constraint.</div>';
        return;
      }
      el.timeline.innerHTML = bundle.messages.map((message) => `
        <article class="message ${message.role}">
          <header>
            <strong>${escapeHtml(message.role)}</strong>
            <span>${escapeHtml(message.intent)} · ${escapeHtml(short(message.created_at, 24))}</span>
          </header>
          <pre>${escapeHtml(message.content)}</pre>
        </article>
      `).join("");
      el.timeline.scrollTop = el.timeline.scrollHeight;
    }

    function renderInspector(bundle) {
      if (!bundle) {
        el.inspector.innerHTML = '<div class="empty">No active session.</div>';
        return;
      }
      el.inspector.innerHTML = [
        renderWorkspace(bundle),
        renderSkills(bundle),
        renderPlan(bundle.plan_draft),
        renderMemory(bundle),
        renderHarness(bundle),
        renderTools(bundle),
        renderQuality(bundle),
        renderRun(bundle.active_run),
      ].join("");
      bindInspectorActions();
    }

    function renderPlan(plan) {
      if (!plan) {
        return '<section class="block"><h3>Plan</h3><p>No draft yet.</p></section>';
      }
      return `
        <section class="block">
          <h3>Plan Draft</h3>
          <p>${escapeHtml(plan.research_brief)}</p>
          <ol>${plan.plan_items.map((item) => `<li>${escapeHtml(item.question)}</li>`).join("")}</ol>
          <div class="settings">
            <button id="confirmPlanInline" class="primary">确认并开始研究</button>
            <button id="continueConstraintsBtn">继续补充约束</button>
          </div>
        </section>
      `;
    }

    function renderWorkspace(bundle) {
      const workspace = bundle.workspace || {};
      const workspaceId = workspace.workspace_id || state.activeWorkspaceId || "";
      const stackValue = (workspace.default_stack || []).join(", ");
      const deploymentValue = (workspace.deployment_constraints || []).join(", ");
      const sourcesValue = (workspace.preferred_sources || []).join(", ");
      const disabledValue = (workspace.disabled_tools || []).join(", ");
      return `
        <section class="block">
          <h3>Workspace</h3>
          <p>${escapeHtml(workspace.name || "No workspace")}</p>
          <div class="workspace-form">
            <input id="workspaceName" value="${escapeHtml(workspace.name || "")}" placeholder="Workspace name" />
            <textarea id="workspaceTeamContext" placeholder="Team context">${escapeHtml(workspace.team_context || "")}</textarea>
            <textarea id="workspaceRiskPolicy" placeholder="Risk policy">${escapeHtml(workspace.risk_policy || "")}</textarea>
            <input id="workspaceDefaultStack" value="${escapeHtml(stackValue)}" placeholder="Default stack, comma separated" />
            <input id="workspaceDeployment" value="${escapeHtml(deploymentValue)}" placeholder="Deployment constraints, comma separated" />
            <input id="workspaceSources" value="${escapeHtml(sourcesValue)}" placeholder="Preferred sources, comma separated" />
            <input id="workspaceDisabled" value="${escapeHtml(disabledValue)}" placeholder="Disabled tools, comma separated" />
            <div class="settings">
              <button id="saveWorkspaceBtn" class="primary" data-workspace-id="${escapeHtml(workspaceId)}">Save Workspace</button>
            </div>
          </div>
          <div class="metric-grid">
            ${metric("workspace id", workspaceId || "default")}
            ${metric("session key", bundle.session.session_key || bundle.session.session_id)}
            ${metric("updated", short(workspace.updated_at, 24))}
            ${metric("source prefs", (workspace.preferred_sources || []).length)}
          </div>
        </section>
      `;
    }

    function renderSkills(bundle) {
      const selected = bundle.selected_skill || {};
      const catalog = bundle.skill_catalog || [];
      const scripts = selected.scripts || [];
      return `
        <section class="block">
          <h3>Skills</h3>
          <p>${escapeHtml(selected.name || "No skill selected")}</p>
          <div class="metric-grid">
            ${metric("skill id", selected.skill_id || "n/a")}
            ${metric("type", selected.skill_type || "builtin")}
            ${metric("version", selected.version || "n/a")}
            ${metric("scenario", short(selected.scenario || "", 44))}
            ${metric("required inputs", (selected.required_inputs || []).length)}
            ${metric("focus", (selected.evaluation_focus || []).length)}
            ${metric("scripts", scripts.length)}
          </div>
          ${selected.source_path ? `<p class="subtle">pack: ${escapeHtml(selected.source_path)}${selected.instruction_path ? ` · ${escapeHtml(selected.instruction_path)}` : ""}</p>` : ""}
          ${selected.instructions_excerpt ? `<p class="subtle">${escapeHtml(short(selected.instructions_excerpt, 240))}</p>` : ""}
          ${scripts.length ? `
            <div class="settings">
              ${scripts.map((script) => `
                <button class="compact" data-run-skill="${escapeHtml(selected.skill_id)}" data-script-name="${escapeHtml(script.name)}">${escapeHtml(script.name)}</button>
              `).join("")}
            </div>
          ` : ""}
          ${catalog.length ? catalog.map((skill) => `
            <div class="quality-row">
              <span><strong>${escapeHtml(skill.name)}</strong> · ${escapeHtml(skill.skill_id)}</span>
              <span>${escapeHtml(short(skill.scenario, 140))}${skill.scripts && skill.scripts.length ? ` · ${skill.scripts.length} script(s)` : ""}</span>
            </div>
          `).join("") : '<p>No skill catalog yet.</p>'}
        </section>
      `;
    }

    function renderMemory(bundle) {
      const items = bundle.memory || [];
      const evaluation = bundle.memory_evaluation || {};
      const extractionResults = bundle.memory_extraction_results || [];
      return `
        <section class="block">
          <h3>Memory</h3>
          <div class="metric-grid">
            ${metric("precision", evaluation.memory_precision)}
            ${metric("recall proxy", evaluation.memory_recall)}
            ${metric("accepted", evaluation.accepted_count)}
            ${metric("project constraints", evaluation.project_constraint_count)}
          </div>
          <div class="memory-form">
            <textarea id="memoryInput" placeholder="保存团队约束、偏好或决策"></textarea>
            <div class="settings">
              <select id="memoryScope">
                <option value="project">project</option>
                <option value="user">user</option>
                <option value="session">session</option>
              </select>
              <select id="memoryKind">
                <option value="constraint">constraint</option>
                <option value="preference">preference</option>
                <option value="decision">decision</option>
                <option value="fact">fact</option>
                <option value="todo">todo</option>
              </select>
              <button id="saveMemoryBtn">Save</button>
            </div>
          </div>
          ${items.length ? items.slice(0, 12).map((item) => `
            <div class="memory-row">
              <div class="row-head">
                <strong>${escapeHtml(item.scope)} / ${escapeHtml(item.kind)}</strong>
                <button class="compact danger" data-delete-memory="${escapeHtml(item.memory_id)}">Delete</button>
              </div>
              <span>${escapeHtml(item.content)}</span>
              <span class="subtle">${escapeHtml(item.metadata && item.metadata.hard_constraint ? "hard constraint" : "memory")} · ${escapeHtml(short(item.updated_at, 24))}</span>
            </div>
          `).join("") : '<p>No memory yet.</p>'}
          ${extractionResults.length ? `
            <h3>Extraction</h3>
            ${extractionResults.slice(-4).reverse().map((result) => `
              <div class="extraction-row">
                <strong>${escapeHtml(result.accepted.length)} accepted / ${escapeHtml(result.rejected.length)} rejected</strong>
                <span>${escapeHtml(short(result.reason, 180))}</span>
              </div>
            `).join("")}
          ` : ""}
        </section>
      `;
    }

    function renderHarness(bundle) {
      const assignments = bundle.role_assignments || (bundle.active_run ? bundle.active_run.role_assignments || [] : []);
      const decisions = bundle.route_decisions || (bundle.active_run ? bundle.active_run.route_decisions || [] : []);
      const conflicts = bundle.conflicts || (bundle.active_run ? bundle.active_run.conflicts || [] : []);
      const ledger = bundle.evidence_ledger || (bundle.active_run ? bundle.active_run.evidence_ledger : null) || {};
      const summary = bundle.benchmark_summary || (bundle.active_run ? bundle.active_run.benchmark_summary : null) || {};
      return `
        <section class="block">
          <h3>Harness</h3>
          <div class="metric-grid">
            ${metric("roles", assignments.length)}
            ${metric("routes", decisions.length)}
            ${metric("conflicts", conflicts.length)}
            ${metric("replay fidelity", summary.replay_fidelity)}
            ${metric("evidence used", ledger.utilization_rate)}
            ${metric("route recall", summary.route_recall)}
          </div>
          ${assignments.length ? assignments.map((assignment) => `
            <div class="quality-row">
              <div class="row-head">
                <strong>${escapeHtml(assignment.agent_name || assignment.agent_id)}</strong>
                <span class="pill ${assignment.status === "completed" ? "good" : "warn"}">${escapeHtml(assignment.status)}</span>
              </div>
              <span>${escapeHtml(short(assignment.reason, 180))}</span>
              <span class="subtle">${escapeHtml((assignment.selected_tools || []).join(", ") || "no tool")} · evidence ${escapeHtml(assignment.evidence_count || 0)}</span>
            </div>
          `).join("") : '<p>No role assignment yet.</p>'}
          ${conflicts.length ? `
            <h3>Conflicts</h3>
            ${conflicts.slice(0, 6).map((conflict) => `
              <div class="coverage-row">
                <div class="row-head">
                  <strong>${escapeHtml(conflict.kind)}</strong>
                  <span class="pill ${conflict.resolved ? "good" : conflict.severity === "high" ? "bad" : "warn"}">${escapeHtml(conflict.severity)}</span>
                </div>
                <span>${escapeHtml(short(conflict.description, 180))}</span>
                <span class="subtle">${escapeHtml(short(conflict.resolution, 180))}</span>
              </div>
            `).join("")}
          ` : ""}
          ${Object.keys(ledger.by_agent || {}).length ? `
            <h3>Evidence Ledger</h3>
            <div class="source-row">
              <strong>by agent</strong>
              <span>${escapeHtml(JSON.stringify(ledger.by_agent || {}))}</span>
            </div>
            <div class="source-row">
              <strong>by tool</strong>
              <span>${escapeHtml(JSON.stringify(ledger.by_tool || {}))}</span>
            </div>
          ` : ""}
        </section>
      `;
    }

    function renderRun(run) {
      if (!run || !run.report) {
        return '<section class="block"><h3>Run Result</h3><p>No completed report yet.</p></section>';
      }
      const evaluation = run.evaluation || {};
      return `
        <section class="block report">
          <h3>${escapeHtml(run.report.title)}</h3>
          <p>${escapeHtml(run.report.summary)}</p>
          <div class="metric-grid">
            ${metric("citation", evaluation.citation_precision)}
            ${metric("faithfulness", evaluation.faithfulness_proxy)}
            ${metric("context recall", evaluation.context_recall)}
            ${metric("sources", run.report.source_count)}
          </div>
          ${run.report.sections.map((section) => `
            <div class="report-section">
              <strong>${escapeHtml(section.heading)}</strong>
              <p>${escapeHtml(section.content)}</p>
            </div>
          `).join("")}
        </section>
      `;
    }

    function renderTools(bundle) {
      const run = bundle.active_run;
      const routes = run ? run.retrieval_routes || [] : [];
      const trace = run ? run.trace || [] : [];
      const registry = bundle.tool_registry || [];
      const invocations = bundle.tool_invocations || [];
      const approvals = bundle.approval_requests || [];
      const steps = bundle.steps || [];
      return `
        <section class="block">
          <h3>Tools</h3>
          <p>${escapeHtml((bundle.mcp_status || {}).reason || "Tool registry is ready.")}</p>
          ${registry.length ? registry.map((tool) => `
            <div class="tool-row">
              <div class="row-head">
                <strong>${escapeHtml(tool.name)} · ${escapeHtml(tool.channel)}</strong>
                <span class="pill ${tool.enabled ? "good" : tool.requires_auth ? "warn" : "bad"}">${tool.enabled ? "enabled" : "unavailable"}</span>
              </div>
              <span>${escapeHtml(short(tool.description, 180))}</span>
              <span class="subtle">risk ${escapeHtml(tool.risk_level)} · approval ${tool.approval_required ? "required" : "not required"} · auth ${tool.auth_configured ? "ok" : "missing"}</span>
            </div>
          `).join("") : '<p>No tool registry yet.</p>'}
          ${approvals.length ? `
            <h3>Approvals</h3>
            ${approvals.slice(-6).reverse().map((approval) => `
              <div class="approval-row">
                <div class="row-head">
                  <strong>${escapeHtml(approval.status)} · ${escapeHtml(short(approval.requested_action, 60))}</strong>
                  ${approval.status === "pending" ? `
                    <span class="settings">
                      <button class="compact primary" data-approve="${escapeHtml(approval.approval_id)}">Approve</button>
                      <button class="compact danger" data-reject="${escapeHtml(approval.approval_id)}">Reject</button>
                    </span>
                  ` : ""}
                </div>
                <span>${escapeHtml(short(approval.reason, 180))}</span>
              </div>
            `).join("")}
          ` : ""}
          ${invocations.length ? `
            <h3>Invocations</h3>
            ${invocations.slice(-8).reverse().map((invocation) => `
              <div class="tool-row">
                <div class="row-head">
                  <strong>${escapeHtml(invocation.tool_name)}</strong>
                  <span class="pill ${invocation.status === "completed" ? "good" : invocation.status === "failed" || invocation.status === "skipped" ? "bad" : "warn"}">${escapeHtml(invocation.status)}</span>
                </div>
                <span>${escapeHtml(short(invocation.result_preview || invocation.error || JSON.stringify(invocation.arguments || {}), 180))}</span>
              </div>
            `).join("")}
          ` : ""}
          ${steps.length ? `
            <h3>Steps</h3>
            ${steps.slice(-12).reverse().map((step) => `
              <div class="step-row">
                <div class="row-head">
                  <strong>${escapeHtml(step.kind)} · ${escapeHtml(step.actor)}</strong>
                  <span class="pill ${step.status === "completed" ? "good" : step.status === "failed" ? "bad" : "warn"}">${escapeHtml(step.status)}</span>
                </div>
                <span>${escapeHtml(short(step.title, 120))}</span>
                <span class="subtle">${escapeHtml(step.tool_name || "no tool")} · evidence ${escapeHtml(step.evidence_count || 0)}</span>
              </div>
            `).join("")}
          ` : ""}
          ${routes.length ? `<h3>Routes</h3>` : ""}
          ${routes.length ? routes.slice(0, 8).map((route) => `
            <div class="source-row">
              <strong>${escapeHtml(route.mode)} · ${escapeHtml((route.selected_tools || []).join(", ") || "no tool")}</strong>
              <span>${escapeHtml(short(route.reason, 180))}</span>
            </div>
          `).join("") : '<p>No route decisions yet.</p>'}
          ${trace.length ? trace.slice(-8).map((event) => `
            <div class="trace-row">
              <strong>${escapeHtml(event.actor)} · ${escapeHtml(event.kind)}</strong>
              <span>${escapeHtml(short(event.message, 180))}</span>
            </div>
          `).join("") : ""}
        </section>
      `;
    }

    function renderQuality(bundle) {
      const run = bundle.active_run;
      const evaluation = run && run.evaluation ? run.evaluation : {};
      const coverage = bundle.constraint_coverage || [];
      const coveredCount = coverage.filter((item) => item.covered).length;
      const coverageScore = coverage.length ? coveredCount / coverage.length : null;
      return `
        <section class="block">
          <h3>Quality</h3>
          <div class="metric-grid">
            ${metric("citation", evaluation.citation_precision)}
            ${metric("faithfulness", evaluation.faithfulness_proxy)}
            ${metric("context recall", evaluation.context_recall)}
            ${metric("constraint coverage", coverageScore === null ? "n/a" : coverageScore.toFixed(2))}
          </div>
          ${coverage.length ? coverage.map((item) => `
            <div class="coverage-row">
              <div class="row-head">
                <strong>${escapeHtml(item.covered ? "covered" : "missing")}</strong>
                <span class="pill ${item.covered ? "good" : "warn"}">${escapeHtml(item.confidence)}</span>
              </div>
              <span>${escapeHtml(item.content)}</span>
              <span class="subtle">${escapeHtml(item.reason)} · ${escapeHtml((item.matched_sections || []).join(", ") || "no matched section")}</span>
            </div>
          `).join("") : '<p>No constraint coverage yet.</p>'}
          ${(evaluation.notes || []).length ? `
            <h3>Notes</h3>
            ${(evaluation.notes || []).slice(-5).map((note) => `<div class="quality-row"><span>${escapeHtml(note)}</span></div>`).join("")}
          ` : ""}
        </section>
      `;
    }

    function metric(label, value) {
      return `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value ?? "n/a")}</strong></div>`;
    }

    function bindInspectorActions() {
      const inlineConfirm = document.getElementById("confirmPlanInline");
      if (inlineConfirm) inlineConfirm.addEventListener("click", confirmPlan);
      const continueBtn = document.getElementById("continueConstraintsBtn");
      if (continueBtn) continueBtn.addEventListener("click", () => el.messageInput.focus());
      const saveBtn = document.getElementById("saveMemoryBtn");
      if (saveBtn) saveBtn.addEventListener("click", saveMemory);
      const saveWorkspaceBtn = document.getElementById("saveWorkspaceBtn");
      if (saveWorkspaceBtn) saveWorkspaceBtn.addEventListener("click", saveWorkspace);
      el.inspector.querySelectorAll("[data-run-skill]").forEach((button) => {
        button.addEventListener("click", () => runSkillScript(button.dataset.runSkill, button.dataset.scriptName));
      });
      el.inspector.querySelectorAll("[data-delete-memory]").forEach((button) => {
        button.addEventListener("click", () => deleteMemory(button.dataset.deleteMemory));
      });
      el.inspector.querySelectorAll("[data-approve]").forEach((button) => {
        button.addEventListener("click", () => resolveApproval(button.dataset.approve, true));
      });
      el.inspector.querySelectorAll("[data-reject]").forEach((button) => {
        button.addEventListener("click", () => resolveApproval(button.dataset.reject, false));
      });
    }

    async function createSession() {
      const session = await api("/v1/agent/sessions", {
        method: "POST",
        body: JSON.stringify({ title: "Research session", workspace_id: state.activeWorkspaceId }),
      });
      state.activeSessionId = session.session_id;
      await loadSessions();
      await loadBundle(session.session_id);
    }

    async function sendMessage() {
      const content = el.messageInput.value.trim();
      if (!content) return;
      if (!state.activeSessionId) {
        await createSession();
      }
      el.sendBtn.disabled = true;
      let turnPollTimer = null;
      let turnPollBusy = false;
      try {
        const turnRequest = api(`/v1/agent/sessions/${state.activeSessionId}/messages`, {
          method: "POST",
          body: JSON.stringify({
            content,
            depth: el.depthSelect.value,
            max_sections: Number(el.maxSectionsInput.value || 4),
          }),
        });
        turnPollTimer = setInterval(async () => {
          if (!state.activeSessionId || turnPollBusy) return;
          turnPollBusy = true;
          try {
            await loadBundle(state.activeSessionId);
          } catch (_) {
            // The final request handler will surface the user-visible error.
          } finally {
            turnPollBusy = false;
          }
        }, 2000);
        await turnRequest;
        el.messageInput.value = "";
        await loadSessions();
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      } finally {
        if (turnPollTimer) clearInterval(turnPollTimer);
        el.sendBtn.disabled = false;
      }
    }

    async function confirmPlan() {
      if (!state.activeSessionId) return;
      el.confirmBtn.disabled = true;
      try {
        await api(`/v1/agent/sessions/${state.activeSessionId}/confirm-plan`, { method: "POST" });
        await loadSessions();
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function saveMemory() {
      const input = document.getElementById("memoryInput");
      const scope = document.getElementById("memoryScope");
      const kind = document.getElementById("memoryKind");
      const content = input.value.trim();
      if (!content) return;
      try {
        await api("/v1/memory", {
          method: "POST",
          body: JSON.stringify({
            content,
            scope: scope.value,
            kind: kind.value,
            session_id: state.activeSessionId,
          }),
        });
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function saveWorkspace() {
      if (!state.bundle || !state.bundle.workspace) return;
      const workspaceId = document.getElementById("saveWorkspaceBtn")?.dataset.workspaceId || state.bundle.workspace.workspace_id;
      try {
        await api("/v1/agent/workspaces", {
          method: "POST",
          body: JSON.stringify({
            workspace_id: workspaceId,
            name: document.getElementById("workspaceName").value.trim() || "Workspace",
            team_context: document.getElementById("workspaceTeamContext").value.trim(),
            risk_policy: document.getElementById("workspaceRiskPolicy").value.trim(),
            default_stack: document.getElementById("workspaceDefaultStack").value.split(",").map((item) => item.trim()).filter(Boolean),
            deployment_constraints: document.getElementById("workspaceDeployment").value.split(",").map((item) => item.trim()).filter(Boolean),
            preferred_sources: document.getElementById("workspaceSources").value.split(",").map((item) => item.trim()).filter(Boolean),
            disabled_tools: document.getElementById("workspaceDisabled").value.split(",").map((item) => item.trim()).filter(Boolean),
          }),
        });
        await loadSessions();
      } catch (error) {
        showError(error.message);
      }
    }

    async function runSkillScript(skillId, scriptName) {
      if (!state.activeSessionId || !skillId || !scriptName) return;
      const bundle = state.bundle || {};
      const lastUserMessage = [...(bundle.messages || [])].reverse().find((message) => message.role === "user");
      try {
        await api(`/v1/agent/skills/${skillId}/scripts/${scriptName}/run`, {
          method: "POST",
          body: JSON.stringify({
            payload: {
              content: lastUserMessage ? lastUserMessage.content : "",
              workspace: bundle.workspace || {},
              selected_skill: bundle.selected_skill || {},
              session_summary: bundle.session ? bundle.session.context_summary : "",
            },
          }),
        });
        await loadBundle(state.activeSessionId);
        await loadSessions();
      } catch (error) {
        showError(error.message);
      }
    }

    async function deleteMemory(memoryId) {
      if (!memoryId || !state.activeSessionId) return;
      try {
        await api(`/v1/memory/${memoryId}`, { method: "DELETE" });
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function resolveApproval(approvalId, approve) {
      if (!approvalId || !state.activeSessionId) return;
      const action = approve ? "approve" : "reject";
      try {
        await api(`/v1/agent/sessions/${state.activeSessionId}/approvals/${approvalId}/${action}`, { method: "POST" });
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function exportSession() {
      if (!state.activeSessionId) return;
      try {
        const bundle = await api(`/v1/agent/sessions/${state.activeSessionId}/export`);
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `agent-session-${state.activeSessionId}.json`;
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        showError(error.message);
      }
    }

    function syncPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
      const status = state.bundle && state.bundle.session.status;
      if (status === "planning" || status === "researching") {
        state.pollTimer = setInterval(async () => {
          try {
            await loadBundle(state.activeSessionId);
          } catch (_) {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
          }
        }, 2000);
      }
    }

    function showError(message) {
      const node = document.createElement("article");
      node.className = "message assistant";
      node.innerHTML = `<header><strong>error</strong></header><pre class="error">${escapeHtml(message)}</pre>`;
      el.timeline.appendChild(node);
    }

    el.newSessionBtn.addEventListener("click", createSession);
    el.sendBtn.addEventListener("click", sendMessage);
    el.confirmBtn.addEventListener("click", confirmPlan);
    el.exportBtn.addEventListener("click", exportSession);
    el.refreshBtn.addEventListener("click", () => state.activeSessionId ? loadBundle(state.activeSessionId) : loadSessions());
    el.messageInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        sendMessage();
      }
    });

    api("/health")
      .then(() => {
        el.apiStatus.textContent = "API ok";
        el.apiStatus.className = "pill good";
      })
      .catch(() => {
        el.apiStatus.textContent = "API offline";
        el.apiStatus.className = "pill bad";
      });

    loadSessions().catch((error) => showError(error.message));
  </script>
</body>

</html>
