<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Research Copilot · Agent Workbench</title>
  <link rel="icon" href="data:," />
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7fa;
      --ink: #152033;
      --muted: #647084;
      --line: #d9e0ea;
      --surface: #ffffff;
      --soft: #eef3f7;
      --accent: #0f766e;
      --accent-strong: #0b5d56;
      --warn: #a16207;
      --bad: #b91c1c;
      --good: #15803d;
      --shadow: 0 8px 22px rgba(21, 32, 51, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 8px 12px;
      white-space: nowrap;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    button.primary:hover {
      background: var(--accent-strong);
    }

    button.danger {
      border-color: #fecaca;
      color: var(--bad);
      background: #fff7f7;
    }

    button.compact {
      min-height: 28px;
      padding: 4px 8px;
      font-size: 12px;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.62;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid #cfd8e3;
      border-radius: 8px;
      background: #fff;
      color: var(--ink);
      padding: 10px 12px;
      outline: none;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.12);
    }

    .shell {
      height: 100vh;
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .topbar {
      min-height: 62px;
      padding: 12px clamp(14px, 3vw, 28px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.94);
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .brand {
      display: grid;
      gap: 2px;
      min-width: 0;
    }

    .brand strong {
      font-size: 17px;
    }

    .brand span {
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .layout {
      width: min(1580px, 100%);
      margin: 0 auto;
      padding: 14px clamp(12px, 3vw, 24px) 24px;
      display: grid;
      grid-template-columns: 220px minmax(0, 1fr) 280px;
      gap: 14px;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }

    .panel {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .side,
    .chat,
    .inspector {
      min-height: 0;
      overflow: hidden;
    }

    .side {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .chat {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
    }

    .inspector {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    .panel-head {
      min-height: 54px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
    }

    .panel-head h2,
    .panel-head h3 {
      margin: 0;
      font-size: 15px;
    }

    .panel-head .subtle {
      margin-left: auto;
    }

    .session-list,
    .timeline,
    .inspector-body {
      min-height: 0;
      overflow: auto;
    }

    .session-list {
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .session-row {
      width: 100%;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 8px;
      background: #f8fafc;
      min-height: 68px;
      white-space: normal;
      justify-content: stretch;
      align-items: start;
      overflow: hidden;
    }

    .session-row.active {
      border-color: #9bd2ca;
      background: #edf9f6;
    }

    .session-main {
      min-height: 66px;
      border: 0;
      background: transparent;
      display: grid;
      gap: 5px;
      justify-content: stretch;
      text-align: left;
      padding: 10px;
    }

    .session-main:hover {
      background: rgba(15, 118, 110, 0.06);
    }

    .session-delete {
      margin: 8px 8px 0 0;
    }

    .session-row strong,
    .session-row span {
      overflow-wrap: anywhere;
    }

    .session-row span {
      color: var(--muted);
      font-size: 12px;
    }

    .status-strip {
      padding: 10px 14px;
      border-bottom: 1px solid var(--line);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
      background: #f8fafc;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      border-radius: 999px;
      padding: 3px 9px;
      background: var(--soft);
      color: var(--muted);
      font-size: 12px;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .pill.good {
      color: var(--good);
      background: #e9f7ee;
    }

    .pill.warn {
      color: var(--warn);
      background: #fff7e6;
    }

    .pill.bad {
      color: var(--bad);
      background: #fef2f2;
    }

    .timeline {
      padding: 18px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .message {
      width: min(760px, 92%);
      display: grid;
      gap: 7px;
      padding: 13px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }

    .message.user {
      justify-self: end;
      background: #eef6ff;
      border-color: #c8ddff;
    }

    .message.assistant {
      justify-self: start;
    }

    .message.pending {
      border-color: #b9d8d2;
      background: #f1faf8;
    }

    .message.pending header strong::before {
      content: "";
      width: 8px;
      height: 8px;
      margin-right: 7px;
      border-radius: 999px;
      display: inline-block;
      background: var(--accent);
      animation: pulse 1.2s ease-in-out infinite;
    }

    .message.compact-message {
      background: #f8fafc;
      border-color: #dbe4ef;
    }

    .message details {
      border-top: 1px solid var(--line);
      padding-top: 8px;
    }

    .message summary,
    .conversation-history summary,
    .report-section summary {
      cursor: pointer;
      color: var(--accent);
      font-weight: 700;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
      }

      50% {
        opacity: 1;
      }
    }

    .message header {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .message pre {
      margin: 0;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      font-family: inherit;
      line-height: 1.55;
    }

    .composer {
      border-top: 1px solid var(--line);
      padding: 14px;
      display: grid;
      gap: 10px;
      background: #fff;
    }

    .composer textarea {
      min-height: 104px;
      resize: vertical;
    }

    .composer-hint {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .field-label {
      color: var(--muted);
      font-size: 12px;
    }

    .advanced-settings {
      display: grid;
      gap: 8px;
      padding-top: 2px;
    }

    .advanced-settings summary {
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      list-style-position: inside;
    }

    .advanced-settings .settings {
      padding-top: 4px;
    }

    .composer-actions,
    .settings {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .composer-actions {
      justify-content: space-between;
    }

    .settings select,
    .settings input {
      width: auto;
      min-width: 94px;
    }

    .inspector-body {
      padding: 14px;
      display: grid;
      align-content: start;
      gap: 14px;
    }

    .block {
      display: grid;
      gap: 10px;
      padding: 0 0 16px;
      border-bottom: 1px solid var(--line);
    }

    .block:last-child {
      border-bottom: 0;
    }

    .block h3 {
      margin: 0;
      font-size: 14px;
    }

    .block p,
    .block li {
      color: #2a3547;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .block p,
    .block ul,
    .block ol {
      margin: 0;
    }

    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 9px;
      background: #f8fafc;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 12px;
    }

    .metric strong {
      display: block;
      margin-top: 3px;
    }

    .summary-line {
      display: grid;
      gap: 3px;
      padding-top: 2px;
    }

    .summary-line span {
      color: #2a3547;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .summary-alert {
      display: grid;
      gap: 4px;
      padding: 9px 10px;
      border-radius: 8px;
      line-height: 1.45;
    }

    .summary-alert.bad {
      color: var(--bad);
      background: #fef2f2;
      border: 1px solid #fecaca;
    }

    .observation-links {
      display: grid;
      gap: 7px;
    }

    .compact-link {
      display: block;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      background: #fff;
      font-size: 12px;
      text-decoration: none;
      line-height: 1.35;
    }

    .compact-link:hover {
      border-color: #9bd2ca;
      background: #f1faf8;
    }

    .compact-link.primary-link {
      color: #fff;
      border-color: var(--accent);
      background: var(--accent);
    }

    .compact-link.primary-link:hover {
      background: var(--accent-strong);
    }

    .memory-form,
    .workspace-form {
      display: grid;
      gap: 8px;
    }

    .workspace-form textarea {
      min-height: 70px;
      resize: vertical;
    }

    .memory-row,
    .source-row,
    .trace-row,
    .step-row,
    .tool-row,
    .approval-row,
    .coverage-row,
    .extraction-row,
    .quality-row {
      display: grid;
      gap: 4px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .memory-row:last-child,
    .source-row:last-child,
    .trace-row:last-child,
    .step-row:last-child,
    .tool-row:last-child,
    .approval-row:last-child,
    .coverage-row:last-child,
    .extraction-row:last-child,
    .quality-row:last-child {
      border-bottom: 0;
      padding-bottom: 0;
    }

    .row-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .row-head strong,
    .row-head span,
    .tool-row span,
    .step-row span,
    .approval-row span,
    .coverage-row span,
    .extraction-row span,
    .quality-row span {
      overflow-wrap: anywhere;
    }

    .subtle {
      color: var(--muted);
      font-size: 12px;
    }

    .report {
      display: grid;
      gap: 14px;
      width: min(980px, 100%);
      justify-self: center;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
    }

    .report-hero {
      display: grid;
      gap: 10px;
      padding: 14px;
      border: 1px solid #b9d8d2;
      border-radius: 8px;
      background: #f1faf8;
    }

    .report-title-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .report-title-row h2 {
      margin: 0;
      font-size: 18px;
    }

    .report-summary {
      margin: 0;
      color: #1f2937;
      line-height: 1.75;
    }

    .report-list {
      display: grid;
      gap: 8px;
    }

    .report-list-item {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px;
      background: #f8fafc;
      line-height: 1.6;
    }

    .report-section {
      display: grid;
      gap: 0;
      padding: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .report-section summary {
      padding: 12px;
      color: #0f172a;
      background: #f8fafc;
    }

    .report-section-body {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid var(--line);
    }

    .report-section-body p {
      margin: 0;
      line-height: 1.75;
    }

    .report-sources {
      margin: 0;
      padding-left: 22px;
      display: grid;
      gap: 6px;
    }

    .conversation-history {
      width: min(760px, 92%);
      justify-self: start;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: #fff;
    }

    .conversation-history .message {
      width: 100%;
      margin-top: 10px;
    }

    .empty {
      color: var(--muted);
      background: #f8fafc;
      border: 1px dashed #cfd8e3;
      border-radius: 8px;
      padding: 14px;
      line-height: 1.5;
    }

    .quick-start,
    .next-step {
      display: grid;
      gap: 8px;
      padding: 14px;
      border: 1px solid #cfe4e0;
      border-radius: 8px;
      background: #f1faf8;
    }

    .quick-start h3,
    .next-step h3 {
      margin: 0;
      font-size: 14px;
    }

    .quick-start ol,
    .next-step p {
      margin: 0;
      line-height: 1.55;
    }

    .quick-start ol {
      padding-left: 20px;
    }

    .advanced-panel {
      border-top: 1px solid var(--line);
      padding-top: 14px;
    }

    .advanced-panel summary {
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      list-style-position: inside;
    }

    .advanced-panel:not([open]) .advanced-content {
      display: none;
    }

    .advanced-panel[open] .advanced-content {
      display: grid;
      gap: 16px;
      padding-top: 14px;
    }

    .advanced-content .block {
      padding-bottom: 14px;
    }

    .error {
      color: var(--bad);
    }

    @media (max-width: 1180px) {
      .layout {
        grid-template-columns: 220px minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) minmax(240px, 0.55fr);
      }

      .inspector {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 820px) {
      html,
      body {
        height: auto;
        overflow: auto;
      }

      .shell {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .layout {
        grid-template-columns: 1fr;
        height: auto;
        min-height: calc(100vh - 62px);
        overflow: visible;
      }

      .side {
        min-height: 220px;
      }

      .chat {
        min-height: min(760px, calc(100vh - 92px));
      }

      .message {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <strong>AI Research Copilot</strong>
        <span>本地技术研究台：输入问题，确认计划，拿到有证据的报告</span>
      </div>
      <div class="settings">
        <a class="pill" href="/docs">API 文档</a>
        <button id="exportBtn" class="compact" title="导出当前会话" disabled>导出会话</button>
        <span id="apiStatus" class="pill warn">检查中</span>
      </div>
    </header>

    <div class="layout">
      <aside class="panel side">
        <div class="panel-head">
          <h2>会话</h2>
          <button id="newSessionBtn" title="新建会话">新建</button>
        </div>
        <div id="sessionList" class="session-list"></div>
      </aside>

      <section class="panel chat">
        <div class="status-strip">
          <span id="sessionStatus" class="pill">未选择会话</span>
          <span id="workspaceStatus" class="pill">工作区未知</span>
          <span id="mcpStatus" class="pill">MCP 未知</span>
          <span id="jobStatus" class="pill">无任务</span>
        </div>
        <div id="timeline" class="timeline"></div>
        <div class="composer">
          <textarea id="messageInput" placeholder="例如：评估 langchain-ai/langgraph 是否适合 5 人 Python/FastAPI 团队。约束：单机 Docker、可回滚。"></textarea>
          <div class="composer-hint">先写清楚“研究什么”和“团队有什么限制”。第一次发送只会生成计划，不会直接开跑。</div>
          <div class="composer-actions">
            <div class="settings">
              <button id="confirmBtn" class="primary" disabled>确认并开始研究</button>
              <button id="sendBtn" class="primary">发送</button>
            </div>
          </div>
          <details class="advanced-settings">
            <summary>高级设置</summary>
            <div class="settings">
              <label class="field-label">研究深度
                <select id="depthSelect" title="Depth">
                  <option value="quick">快速</option>
                  <option value="standard" selected>标准</option>
                  <option value="deep">深入</option>
                </select>
              </label>
              <label class="field-label">报告章节
                <input id="maxSectionsInput" type="number" min="1" max="8" value="4" title="Max sections" />
              </label>
            </div>
          </details>
        </div>
      </section>

      <aside class="panel inspector">
        <div class="panel-head">
          <h2>当前会话</h2>
          <button id="refreshBtn" class="compact" title="刷新当前会话">刷新</button>
        </div>
        <div id="inspector" class="inspector-body"></div>
      </aside>
    </div>
  </div>

  <script>
    const state = {
      sessions: [],
      workspaces: [],
      activeSessionId: null,
      activeWorkspaceId: null,
      bundle: null,
      pollTimer: null,
      eventSource: null,
      eventSourceSessionId: null,
      streamRefreshTimer: null,
      streamCursor: null,
      localActivity: null,
    };

    const el = {
      apiStatus: document.getElementById("apiStatus"),
      sessionList: document.getElementById("sessionList"),
      timeline: document.getElementById("timeline"),
      inspector: document.getElementById("inspector"),
      sessionStatus: document.getElementById("sessionStatus"),
      workspaceStatus: document.getElementById("workspaceStatus"),
      mcpStatus: document.getElementById("mcpStatus"),
      jobStatus: document.getElementById("jobStatus"),
      messageInput: document.getElementById("messageInput"),
      depthSelect: document.getElementById("depthSelect"),
      maxSectionsInput: document.getElementById("maxSectionsInput"),
      sendBtn: document.getElementById("sendBtn"),
      confirmBtn: document.getElementById("confirmBtn"),
      newSessionBtn: document.getElementById("newSessionBtn"),
      refreshBtn: document.getElementById("refreshBtn"),
      exportBtn: document.getElementById("exportBtn"),
    };

    const STATUS_LABELS = {
      collecting: "收集中",
      planning: "规划中",
      awaiting_confirmation: "等待确认",
      researching: "研究中",
      completed: "已完成",
      failed: "失败",
      cancelled: "已取消",
      queued: "排队中",
      running: "运行中",
      pending: "待处理",
      pending_approval: "等待审批",
      approved: "已通过",
      rejected: "已拒绝",
      skipped: "已跳过",
      selected: "已选择",
    };

    const ROLE_LABELS = {
      user: "你",
      assistant: "助手",
      system: "系统",
      tool: "工具",
    };

    const INTENT_LABELS = {
      chat: "对话",
      clarify: "追问",
      plan: "计划",
      confirm: "确认",
      research: "研究",
      follow_up: "跟进",
      system: "系统",
    };

    const KIND_LABELS = {
      message: "消息",
      planning: "规划",
      approval: "审批",
      tool_call: "工具调用",
      retrieval: "检索",
      research: "研究",
      report: "报告",
      verification: "验证",
      evaluation: "评估",
      failure: "失败",
      heartbeat: "心跳",
    };

    const SCOPE_LABELS = {
      user: "用户",
      project: "项目",
      session: "会话",
    };

    const MEMORY_KIND_LABELS = {
      preference: "偏好",
      constraint: "约束",
      decision: "决策",
      fact: "事实",
      todo: "待办",
    };

    const RISK_LABELS = {
      low: "低",
      medium: "中",
      high: "高",
    };

    const SEVERITY_LABELS = {
      low: "低",
      medium: "中",
      high: "高",
    };

    async function api(path, options = {}) {
      const response = await fetch(path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      if (!response.ok) {
        let detail = response.statusText;
        try {
          detail = (await response.json()).detail || detail;
        } catch (_) {
          detail = response.statusText;
        }
        throw new Error(detail);
      }
      return response.json();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function short(value, limit = 90) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return text.length > limit ? `${text.slice(0, limit - 3)}...` : text;
    }

    function asList(value) {
      return Array.isArray(value) ? value.filter((item) => String(item || "").trim()) : [];
    }

    function renderTextParagraphs(value) {
      const lines = String(value || "")
        .split(/\n+/)
        .map((line) => line.trim())
        .filter(Boolean);
      if (!lines.length) return "<p>暂无内容。</p>";
      return lines.map((line) => {
        const cleaned = line.replace(/^[-*]\s+/, "");
        const prefix = /^[-*]\s+/.test(line) ? "• " : "";
        return `<p>${prefix}${escapeHtml(cleaned)}</p>`;
      }).join("");
    }

    function formatTime(value) {
      const text = String(value || "").trim();
      if (!text) return "n/a";
      const date = new Date(text);
      if (Number.isNaN(date.getTime())) return short(text, 24);
      return new Intl.DateTimeFormat("zh-CN", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false,
      }).format(date).replaceAll("/", "-");
    }

    function label(map, value, fallback = "n/a") {
      if (value === undefined || value === null || value === "") return fallback;
      return map[value] || value;
    }

    function statusLabel(value) {
      return label(STATUS_LABELS, value, "未知");
    }

    function statusClass(value) {
      if (["completed", "approved"].includes(value)) return "good";
      if (["failed", "cancelled", "rejected"].includes(value)) return "bad";
      if (value) return "warn";
      return "";
    }

    function setLocalActivity(activity) {
      state.localActivity = activity;
      renderStatus(state.bundle);
      renderTimeline(state.bundle);
    }

    async function loadWorkspaces() {
      state.workspaces = await api("/v1/agent/workspaces");
      if (!state.activeWorkspaceId && state.workspaces.length) {
        state.activeWorkspaceId = state.workspaces[0].workspace_id;
      }
    }

    async function loadSessions() {
      await loadWorkspaces();
      state.sessions = await api("/v1/agent/sessions");
      if (state.activeSessionId && !state.sessions.some((session) => session.session_id === state.activeSessionId)) {
        state.activeSessionId = null;
        state.bundle = null;
      }
      if (!state.activeSessionId && state.sessions.length) {
        state.activeSessionId = state.sessions[0].session_id;
      }
      if (!state.activeWorkspaceId && state.sessions.length && state.sessions[0].workspace_id) {
        state.activeWorkspaceId = state.sessions[0].workspace_id;
      }
      renderSessions();
      if (state.activeSessionId) {
        await loadBundle(state.activeSessionId);
      } else {
        renderAll();
      }
    }

    async function loadBundle(sessionId, options = {}) {
      const { syncLive = true } = options;
      const switchingSession = state.activeSessionId && state.activeSessionId !== sessionId;
      if (switchingSession) {
        stopLiveStream(true);
        state.localActivity = null;
      }
      try {
        state.bundle = await api(`/v1/agent/sessions/${sessionId}`);
      } catch (error) {
        if (/not found/i.test(error.message || "")) {
          state.activeSessionId = null;
          state.bundle = null;
          stopLiveStream(true);
          renderSessions();
          renderAll();
          return;
        }
        throw error;
      }
      state.activeSessionId = sessionId;
      if (state.bundle.workspace && state.bundle.workspace.workspace_id) {
        state.activeWorkspaceId = state.bundle.workspace.workspace_id;
      }
      if (state.bundle.session && !isLiveStatus(state.bundle.session.status)) {
        state.localActivity = null;
      }
      renderAll();
      if (syncLive) {
        syncLiveUpdates();
      }
    }

    function renderSessions() {
      if (!state.sessions.length) {
        el.sessionList.innerHTML = '<div class="empty">还没有会话，点“新建”开始。</div>';
        return;
      }
      const workspaceMap = new Map((state.workspaces || []).map((workspace) => [workspace.workspace_id, workspace]));
      el.sessionList.innerHTML = state.sessions.map((session) => `
        <div class="session-row ${session.session_id === state.activeSessionId ? "active" : ""}">
          <button class="session-main" data-session="${session.session_id}">
            <strong>${escapeHtml(session.title)}</strong>
            <span>${escapeHtml(statusLabel(session.status))} · ${escapeHtml(workspaceMap.get(session.workspace_id || "")?.name || session.workspace_id || "默认工作区")} · ${escapeHtml(formatTime(session.updated_at))}</span>
          </button>
          <button class="compact danger session-delete" data-delete-session="${session.session_id}" title="删除这个会话">删除</button>
        </div>
      `).join("");
      el.sessionList.querySelectorAll("[data-session]").forEach((button) => {
        button.addEventListener("click", () => loadBundle(button.dataset.session));
      });
      el.sessionList.querySelectorAll("[data-delete-session]").forEach((button) => {
        button.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          deleteSession(button.dataset.deleteSession);
        });
      });
    }

    function renderAll() {
      const bundle = state.bundle;
      renderStatus(bundle);
      renderTimeline(bundle);
      renderInspector(bundle);
    }

    function renderStatus(bundle) {
      if (!bundle) {
        el.sessionStatus.textContent = "未选择会话";
        el.sessionStatus.className = "pill";
        el.workspaceStatus.textContent = "工作区未知";
        el.workspaceStatus.className = "pill";
        el.mcpStatus.textContent = "MCP 未知";
        el.jobStatus.textContent = state.localActivity ? (state.localActivity.badge || "处理中") : "无任务";
        el.jobStatus.className = state.localActivity ? "pill warn" : "pill";
        el.confirmBtn.disabled = true;
        el.exportBtn.disabled = true;
        return;
      }
      const status = bundle.session.status;
      el.sessionStatus.textContent = statusLabel(status);
      el.sessionStatus.className = `pill ${statusClass(status)}`;
      const mcp = bundle.mcp_status || {};
      el.mcpStatus.textContent = mcp.label || (mcp.available ? "MCP 可用" : "MCP 未配置");
      el.mcpStatus.className = `pill ${mcp.available ? "good" : "warn"}`;
      const workspace = bundle.workspace || {};
      el.workspaceStatus.textContent = workspace.name || workspace.workspace_id || "工作区未知";
      el.workspaceStatus.className = `pill ${workspace.name ? "good" : ""}`;
      const job = bundle.active_job;
      if (state.localActivity) {
        el.jobStatus.textContent = state.localActivity.badge || "处理中";
        el.jobStatus.className = "pill warn";
      } else {
        el.jobStatus.textContent = job ? `${statusLabel(job.status)} · ${short(job.job_id, 10)}` : "无任务";
        el.jobStatus.className = `pill ${job ? statusClass(job.status) : ""}`;
      }
      el.confirmBtn.disabled = status !== "awaiting_confirmation" || !bundle.plan_draft;
      el.exportBtn.disabled = false;
    }

    function renderTimeline(bundle) {
      const pendingHtml = renderLocalActivity(bundle) || renderServerProgress(bundle);
      const reportHtml = bundle && bundle.active_run && bundle.active_run.report ? renderRun(bundle.active_run) : "";
      if (!bundle) {
        if (pendingHtml) {
          el.timeline.innerHTML = pendingHtml;
          el.timeline.scrollTop = el.timeline.scrollHeight;
          return;
        }
        el.timeline.innerHTML = '<div class="empty">先新建一个会话。</div>';
        return;
      }
      if (!bundle.messages.length && !pendingHtml) {
        el.timeline.innerHTML = '<div class="empty">先输入研究目标和团队约束。</div>';
        return;
      }
      if (reportHtml) {
        const lastUser = [...bundle.messages].reverse().find((message) => message.role === "user");
        const userHtml = lastUser ? renderMessage(lastUser) : "";
        el.timeline.innerHTML = userHtml + renderReportReadyNotice(bundle.active_run) + reportHtml + renderConversationHistory(bundle.messages);
        el.timeline.scrollTop = 0;
        return;
      }
      el.timeline.innerHTML = bundle.messages.map((message) => renderMessage(message)).join("") + pendingHtml;
      el.timeline.scrollTop = el.timeline.scrollHeight;
    }

    function renderMessage(message, options = {}) {
      const rawContent = String(message.content || "");
      const shouldCompact = options.compact || (message.role === "assistant" && rawContent.length > 1000);
      const shownContent = shouldCompact ? short(rawContent, 360) : rawContent;
      return `
        <article class="message ${escapeHtml(message.role)} ${shouldCompact ? "compact-message" : ""}">
          <header>
            <strong>${escapeHtml(label(ROLE_LABELS, message.role, "消息"))}</strong>
            <span>${escapeHtml(label(INTENT_LABELS, message.intent, "对话"))} · ${escapeHtml(formatTime(message.created_at))}</span>
          </header>
          <pre>${escapeHtml(shownContent)}</pre>
          ${shouldCompact ? `<details><summary>展开完整内容</summary><pre>${escapeHtml(rawContent)}</pre></details>` : ""}
        </article>
      `;
    }

    function renderReportReadyNotice(run) {
      return `
        <article class="message assistant report-ready">
          <header>
            <strong>报告已完成</strong>
            <span>Run ${escapeHtml(short(run && run.run_id, 12))}</span>
          </header>
          <pre>研究报告已经生成。先看下方建议、关键发现和质量指标；需要复盘过程时再打开会话事件或 Langfuse Trace。</pre>
        </article>
      `;
    }

    function renderConversationHistory(messages) {
      const history = (messages || []).filter((message) => message.role !== "user" || message.intent !== "chat");
      if (!history.length) return "";
      return `
        <details class="conversation-history">
          <summary>查看计划和确认记录</summary>
          ${history.map((message) => renderMessage(message, { compact: true })).join("")}
        </details>
      `;
    }

    function renderLocalActivity(bundle) {
      const activity = state.localActivity;
      if (!activity) return "";
      const messages = (bundle && bundle.messages) || [];
      const alreadySaved = activity.userContent && messages.some((message) => (
        message.role === "user" && String(message.content || "").trim() === String(activity.userContent || "").trim()
      ));
      const userHtml = activity.userContent ? `
        <article class="message user pending">
          <header>
            <strong>你</strong>
            <span>已发送 · 正在写入会话</span>
          </header>
          <pre>${escapeHtml(activity.userContent)}</pre>
        </article>
      ` : "";
      const visibleUserHtml = alreadySaved ? "" : userHtml;
      return `${visibleUserHtml}
        <article class="message assistant pending">
          <header>
            <strong>${escapeHtml(activity.title || "正在处理")}</strong>
            <span>${escapeHtml(activity.stage || "运行中")} · ${escapeHtml(activityElapsed(activity))}</span>
          </header>
          <pre>${escapeHtml(activityProgressText(activity))}</pre>
        </article>
      `;
    }

    function activityElapsed(activity) {
      if (!activity || !activity.startedAt) return "运行中";
      const seconds = Math.max(0, Math.floor((Date.now() - activity.startedAt) / 1000));
      return `已等待 ${seconds} 秒`;
    }

    function activityProgressText(activity) {
      const base = activity && activity.content ? activity.content : "系统正在处理，请稍等。";
      if (!activity || !activity.startedAt) return base;
      const seconds = Math.max(0, Math.floor((Date.now() - activity.startedAt) / 1000));
      if (seconds < 30) return base;
      return `${base}\n\n模型响应较慢，但服务器仍在执行；可以打开“会话事件”查看 planning step。`;
    }

    function renderServerProgress(bundle) {
      if (!bundle || !bundle.session) return "";
      const status = bundle.session.status;
      if (!["planning", "researching"].includes(status)) return "";
      const steps = [...(bundle.steps || [])];
      const activeStep = steps.reverse().find((step) => ["running", "pending"].includes(step.status)) || steps[0] || null;
      const title = status === "planning" ? "正在生成研究计划" : "研究正在运行";
      const stage = activeStep
        ? `${label(KIND_LABELS, activeStep.kind, "阶段")} · ${statusLabel(activeStep.status)}`
        : statusLabel(status);
      const content = activeStep
        ? `${activeStep.title || title}\n${activeStep.summary || "页面会自动刷新当前阶段。"}`
        : (status === "planning"
          ? "系统已收到输入，正在判断是否需要追问，并生成需要确认的研究计划。"
          : "研究任务正在后台执行，页面会自动刷新报告、trace 和评价指标。");
      return `
        <article class="message assistant pending">
          <header>
            <strong>${escapeHtml(title)}</strong>
            <span>${escapeHtml(stage)}</span>
          </header>
          <pre>${escapeHtml(content)}</pre>
        </article>
      `;
    }

    function renderInspector(bundle) {
      if (!bundle) {
        el.inspector.innerHTML = renderQuickStart(null);
        return;
      }
      el.inspector.innerHTML = [
        renderQuickStart(bundle),
        renderRunSummary(bundle),
      ].join("");
      bindInspectorActions();
    }

    function renderRunSummary(bundle) {
      const run = bundle.active_run;
      const evaluation = run && run.evaluation ? run.evaluation : {};
      const coverage = bundle.constraint_coverage || [];
      const coveredCount = coverage.filter((item) => item.covered).length;
      const coverageScore = coverage.length ? coveredCount / coverage.length : null;
      const assignments = bundle.role_assignments || [];
      const invocations = bundle.tool_invocations || [];
      const completedTools = invocations.filter((item) => item.status === "completed").length;
      const pendingApprovals = (bundle.approval_requests || []).filter((item) => item.status === "pending");
      const provider = bundle.observability || {};
      const published = run && run.metadata && run.metadata.observability
        ? run.metadata.observability
        : {};
      const traceUrl = published.trace_url || "";
      const statusText = provider.enabled
        ? "Langfuse 已连接"
        : provider.provider === "langfuse"
          ? "Langfuse 未配置"
          : "本地观测已启用";
      const statusClassName = provider.enabled ? "good" : provider.provider === "langfuse" ? "warn" : "";
      const selectedNames = assignments
        .filter((assignment) => assignment.status !== "skipped")
        .map((assignment) => assignment.agent_name)
        .filter(Boolean);

      return `
        <section class="block run-summary">
          <h3>运行摘要</h3>
          <div class="metric-grid">
            ${metric("状态", statusLabel(bundle.session.status))}
            ${metric("专家", assignments.length || "待规划")}
            ${metric("来源", run && run.report ? run.report.source_count : "n/a")}
            ${metric("工具完成", invocations.length ? `${completedTools}/${invocations.length}` : "n/a")}
            ${metric("约束覆盖", coverageScore === null ? "n/a" : coverageScore.toFixed(2))}
            ${metric("引用准确", evaluation.citation_precision)}
          </div>
          ${selectedNames.length ? `
            <div class="summary-line">
              <strong>本次参与</strong>
              <span>${escapeHtml(selectedNames.join(" / "))}</span>
            </div>
          ` : ""}
          ${run && run.failure_reason ? `
            <div class="summary-alert bad">
              <strong>运行失败</strong>
              <span>${escapeHtml(short(run.failure_reason, 260))}</span>
            </div>
          ` : ""}
        </section>

        <section class="block observability-summary">
          <h3>过程观测</h3>
          <p class="subtle">主区域看结论；详细 trace、工具链和评估分数在专业观测层查看。页面按本机时间显示，Langfuse 表格可能按 UTC 展示。</p>
          <div class="settings">
            <span class="pill ${statusClassName}">${escapeHtml(statusText)}</span>
            ${run && run.run_id ? `<span class="pill">Run ${escapeHtml(short(run.run_id, 12))}</span>` : ""}
          </div>
          <div class="observation-links">
            ${bundle.session && bundle.session.session_id ? `
              <a class="compact-link primary-link" href="/v1/agent/sessions/${encodeURIComponent(bundle.session.session_id)}/events" target="_blank" rel="noreferrer">新标签查看会话事件</a>
            ` : ""}
            ${run && run.report ? `
              <button class="compact-link primary-link" type="button" data-scroll-report>回到报告</button>
            ` : ""}
            ${traceUrl ? `
              <a class="compact-link" href="${escapeHtml(traceUrl)}" target="_blank" rel="noreferrer">查看 Langfuse Trace</a>
            ` : ""}
            ${run && run.run_id ? `
              <a class="compact-link" href="/v1/research/runs/${encodeURIComponent(run.run_id)}/trace" target="_blank" rel="noreferrer">查看本地 Trace JSON（调试）</a>
            ` : ""}
          </div>
          <p class="subtle">${escapeHtml(provider.reason || "SQLite 保留本地事件、checkpoint 和 replay 数据。会话事件页是给人看的节点视图，本地 Trace JSON 只是调试入口。")}</p>
        </section>

        ${pendingApprovals.length ? `
          <section class="block">
            <h3>待处理</h3>
            ${pendingApprovals.slice(-3).map((approval) => `
              <div class="approval-row">
                <div class="row-head">
                  <strong>${escapeHtml(short(approval.requested_action, 80))}</strong>
                  <span class="pill warn">等待确认</span>
                </div>
                <span>${escapeHtml(short(approval.reason, 160))}</span>
                <div class="settings">
                  <button class="compact primary" data-approve="${escapeHtml(approval.approval_id)}">通过</button>
                  <button class="compact danger" data-reject="${escapeHtml(approval.approval_id)}">拒绝</button>
                </div>
              </div>
            `).join("")}
          </section>
        ` : ""}
      `;
    }

    function renderQuickStart(bundle) {
      if (!bundle) {
        return `
          <section class="quick-start">
            <h3>怎么开始</h3>
            <ol>
              <li>点左侧“新建”。</li>
              <li>输入 repo、技术问题和团队约束。</li>
              <li>先看计划，确认后再开始研究。</li>
            </ol>
          </section>
        `;
      }
      const status = bundle.session.status;
      const guide = nextStepText(bundle);
      const skill = bundle.selected_skill || {};
      return `
        <section class="next-step">
          <h3>下一步</h3>
          <p>${escapeHtml(guide)}</p>
          <div class="settings">
            <span class="pill ${statusClass(status)}">${escapeHtml(statusLabel(status))}</span>
            <span class="pill">${escapeHtml(skill.name || "自动选择 skill")}</span>
          </div>
        </section>
      `;
    }

    function nextStepText(bundle) {
      const status = bundle.session.status;
      if (status === "awaiting_confirmation" && bundle.plan_draft) {
        return "计划已经生成。先检查计划和约束，没问题就点“确认并开始研究”。";
      }
      if (status === "researching") {
        return "研究正在运行。右侧只显示摘要，详细过程会进入 Trace。";
      }
      if (status === "planning") {
        return "正在生成研究计划。页面会自动刷新；需要看细节可以打开“会话事件”。";
      }
      if (status === "completed") {
        return "报告已经完成。先看结果和质量指标，需要复盘时再导出会话。";
      }
      if (status === "failed") {
        return "这次运行失败了。先看右侧失败摘要，再打开本地 Trace 定位问题。";
      }
      if (status === "collecting") {
        return "信息还不够。继续补充 repo、技术问题、团队规模、技术栈和部署约束。";
      }
      return "输入一个技术采用问题，系统会先生成研究计划，不会直接开跑。";
    }

    function renderPlan(bundle) {
      const plan = bundle.plan_draft;
      if (!plan) {
        return '<section class="block"><h3>计划</h3><p>还没有计划。先在中间输入研究目标和团队约束。</p></section>';
      }
      const rolePreview = (plan.metadata && plan.metadata.role_preview) || {};
      const previewWorkers = rolePreview.selected_workers || rolePreview.selected_agents || rolePreview.selected_lanes || [];
      const canConfirm = bundle.session.status === "awaiting_confirmation";
      return `
        <section class="block">
          <h3>计划</h3>
          <p>${escapeHtml(plan.research_brief)}</p>
          <ol>${plan.plan_items.map((item) => `<li>${escapeHtml(item.question)}</li>`).join("")}</ol>
          ${previewWorkers.length ? `<p class="subtle">专家 worker 预览：${previewWorkers.map((worker) => escapeHtml(worker)).join(" / ")}。LangGraph 管流程，worker 负责各自的工具和证据。</p>` : ""}
          ${canConfirm ? `<div class="settings">
            <button id="confirmPlanInline" class="primary">确认并开始研究</button>
            <button id="continueConstraintsBtn">继续补充约束</button>
          </div>` : '<p class="subtle">这份计划已经进入会话记录。</p>'}
        </section>
      `;
    }

    function renderWorkspaceEditor(bundle) {
      const workspace = bundle.workspace || {};
      const workspaceId = workspace.workspace_id || state.activeWorkspaceId || "";
      const stackValue = (workspace.default_stack || []).join(", ");
      const deploymentValue = (workspace.deployment_constraints || []).join(", ");
      const sourcesValue = (workspace.preferred_sources || []).join(", ");
      const disabledValue = (workspace.disabled_tools || []).join(", ");
      return `
        <section class="block">
          <h3>工作区</h3>
          <p>${escapeHtml(workspace.name || "未设置工作区")}</p>
          <div class="workspace-form">
            <input id="workspaceName" value="${escapeHtml(workspace.name || "")}" placeholder="工作区名称" />
            <textarea id="workspaceTeamContext" placeholder="团队背景，例如团队规模、业务场景、技术偏好">${escapeHtml(workspace.team_context || "")}</textarea>
            <textarea id="workspaceRiskPolicy" placeholder="风险策略，例如必须可回滚、不能引入高运维成本">${escapeHtml(workspace.risk_policy || "")}</textarea>
            <input id="workspaceDefaultStack" value="${escapeHtml(stackValue)}" placeholder="默认技术栈，用逗号分隔" />
            <input id="workspaceDeployment" value="${escapeHtml(deploymentValue)}" placeholder="部署约束，用逗号分隔" />
            <input id="workspaceSources" value="${escapeHtml(sourcesValue)}" placeholder="偏好的信息来源，用逗号分隔" />

        <section id="reportTop" class="report">

          ${routes.length ? `<h3>路由明细</h3>` : ""}

              <span>${escapeHtml(short(route.reason, 180))}</span>
            </div>
          `).join("") : '<p>还没有路由记录。</p>'}
          ${trace.length ? trace.slice(-8).map((event) => `
            <div class="trace-row">

    function renderQuality(bundle) {
      const run = bundle.active_run;
      const evaluation = run && run.evaluation ? run.evaluation : {};
      const coverage = bundle.constraint_coverage || [];
      const coveredCount = coverage.filter((item) => item.covered).length;
      const coverageScore = coverage.length ? coveredCount / coverage.length : null;
      return `
        <section class="block">
          <h3>质量</h3>
          <div class="metric-grid">
            ${metric("引用准确", evaluation.citation_precision)}
            ${metric("忠实度", evaluation.faithfulness_proxy)}
            ${metric("上下文召回", evaluation.context_recall)}
            ${metric("约束覆盖", coverageScore === null ? "n/a" : coverageScore.toFixed(2))}
          </div>
          ${coverage.length ? coverage.map((item) => `
            <div class="coverage-row">
              <div class="row-head">
                <strong>${escapeHtml(item.covered ? "已覆盖" : "未覆盖")}</strong>
                <span class="pill ${item.covered ? "good" : "warn"}">${escapeHtml(item.confidence)}</span>
              </div>
              <span>${escapeHtml(item.content)}</span>
              <span class="subtle">${escapeHtml(item.reason)} · ${escapeHtml((item.matched_sections || []).join(", ") || "未匹配章节")}</span>
            </div>
          `).join("") : '<p>还没有约束覆盖。</p>'}
          ${(evaluation.notes || []).length ? `
            <h3>备注</h3>
            ${(evaluation.notes || []).slice(-5).map((note) => `<div class="quality-row"><span>${escapeHtml(note)}</span></div>`).join("")}

    function metric(label, value) {
      return `<div class="metric"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value ?? "n/a")}</strong></div>`;
    }

    function bindInspectorActions() {
      el.inspector.querySelectorAll("[data-approve]").forEach((button) => {
        button.addEventListener("click", () => resolveApproval(button.dataset.approve, true));
      });
      el.inspector.querySelectorAll("[data-reject]").forEach((button) => {
        button.addEventListener("click", () => resolveApproval(button.dataset.reject, false));
      });
      el.inspector.querySelectorAll("[data-scroll-report]").forEach((button) => {
        button.addEventListener("click", () => scrollToReport());
      });
    }

    function scrollToReport() {
      const report = document.getElementById("reportTop");
      if (!report) return;
      report.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    async function createSession() {
      const session = await api("/v1/agent/sessions", {
        method: "POST",
        body: JSON.stringify({ title: "研究会话", workspace_id: state.activeWorkspaceId }),
      });
      state.activeSessionId = session.session_id;
      await loadSessions();
      await loadBundle(session.session_id);
    }

    async function sendMessage() {
      const content = el.messageInput.value.trim();
      if (!content) return;
      if (!state.activeSessionId) {
        await createSession();
      }
      el.sendBtn.disabled = true;
      el.sendBtn.textContent = "处理中...";
      setLocalActivity({
        title: "正在处理你的消息",
        stage: "记忆提取 / skill 选择 / 计划生成",
        badge: "正在规划",
        userContent: content,
        content: "系统已收到输入，正在写入会话、抽取团队约束，并判断是需要追问还是生成研究计划。",
        startedAt: Date.now(),
      });
      try {
        syncLiveUpdates({ force: true });
        const turnRequest = api(`/v1/agent/sessions/${state.activeSessionId}/messages`, {
          method: "POST",
          body: JSON.stringify({
            content,
            depth: el.depthSelect.value,
            max_sections: Number(el.maxSectionsInput.value || 4),
          }),
        });
        await turnRequest;
        state.localActivity = null;
        el.messageInput.value = "";
        await loadSessions();
        await loadBundle(state.activeSessionId);
      } catch (error) {
        state.localActivity = null;
        renderTimeline(state.bundle);
        showError(error.message);
      } finally {
        el.sendBtn.disabled = false;
        el.sendBtn.textContent = "发送";
        renderStatus(state.bundle);
      }
    }

    async function confirmPlan() {
      if (!state.activeSessionId) return;
      el.confirmBtn.disabled = true;
      const originalText = el.confirmBtn.textContent;
      el.confirmBtn.textContent = "启动中...";
      setLocalActivity({
        title: "正在启动研究任务",
        stage: "提交后台 job",
        badge: "正在启动研究",
        content: "计划已确认，正在提交后台研究任务。启动后页面会每 2 秒刷新步骤、工具调用和结果状态。",
      });
      try {
        syncLiveUpdates({ force: true });
        await api(`/v1/agent/sessions/${state.activeSessionId}/confirm-plan`, { method: "POST" });
        state.localActivity = null;
        await loadSessions();
        await loadBundle(state.activeSessionId);
      } catch (error) {
        state.localActivity = null;
        renderTimeline(state.bundle);
        showError(error.message);
      } finally {
        el.confirmBtn.textContent = originalText;
        renderStatus(state.bundle);
      }
    }

    async function saveMemory() {
      const input = document.getElementById("memoryInput");
      const scope = document.getElementById("memoryScope");
      const kind = document.getElementById("memoryKind");
      const content = input.value.trim();
      if (!content) return;
      try {
        await api("/v1/memory", {
          method: "POST",
          body: JSON.stringify({
            content,
            scope: scope.value,
            kind: kind.value,
            session_id: scope.value === "session" ? state.activeSessionId : null,
          }),
        });
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function saveWorkspace() {
      if (!state.bundle || !state.bundle.workspace) return;
      const workspaceId = document.getElementById("saveWorkspaceBtn")?.dataset.workspaceId || state.bundle.workspace.workspace_id;
      try {
        await api("/v1/agent/workspaces", {
          method: "POST",
          body: JSON.stringify({
            workspace_id: workspaceId,
            name: document.getElementById("workspaceName").value.trim() || "研究工作区",
            team_context: document.getElementById("workspaceTeamContext").value.trim(),
            risk_policy: document.getElementById("workspaceRiskPolicy").value.trim(),
            default_stack: document.getElementById("workspaceDefaultStack").value.split(",").map((item) => item.trim()).filter(Boolean),
            deployment_constraints: document.getElementById("workspaceDeployment").value.split(",").map((item) => item.trim()).filter(Boolean),
            preferred_sources: document.getElementById("workspaceSources").value.split(",").map((item) => item.trim()).filter(Boolean),
            disabled_tools: document.getElementById("workspaceDisabled").value.split(",").map((item) => item.trim()).filter(Boolean),
          }),
        });
        await loadSessions();
      } catch (error) {
        showError(error.message);
      }
    }

    async function runSkillScript(skillId, scriptName) {
      if (!state.activeSessionId || !skillId || !scriptName) return;
      const bundle = state.bundle || {};
      const lastUserMessage = [...(bundle.messages || [])].reverse().find((message) => message.role === "user");
      try {
        await api(`/v1/agent/skills/${skillId}/scripts/${scriptName}/run`, {
          method: "POST",
          body: JSON.stringify({
            payload: {
              content: lastUserMessage ? lastUserMessage.content : "",
              workspace: bundle.workspace || {},
              selected_skill: bundle.selected_skill || {},
              session_summary: bundle.session ? bundle.session.context_summary : "",
            },
          }),
        });
        await loadBundle(state.activeSessionId);
        await loadSessions();
      } catch (error) {
        showError(error.message);
      }
    }

    async function deleteMemory(memoryId) {
      if (!memoryId || !state.activeSessionId) return;
      try {
        await api(`/v1/memory/${memoryId}`, { method: "DELETE" });
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function deleteSession(sessionId) {
      if (!sessionId) return;
      const session = (state.sessions || []).find((item) => item.session_id === sessionId);
      const title = session ? session.title : "这个会话";
      if (!window.confirm(`确定删除「${title}」吗？会话消息、步骤、计划和 session 级记忆会一起清掉。`)) return;
      try {
        await api(`/v1/agent/sessions/${sessionId}`, { method: "DELETE" });
        if (state.activeSessionId === sessionId) {
          stopLiveStream(true);
        }
        await loadSessions();
        if (!state.activeSessionId && state.sessions.length) {
          await loadBundle(state.sessions[0].session_id);
        } else if (!state.activeSessionId) {
          state.bundle = null;
          renderAll();
        }
      } catch (error) {
        showError(error.message);
      }
    }

    async function resolveApproval(approvalId, approve) {
      if (!approvalId || !state.activeSessionId) return;
      const action = approve ? "approve" : "reject";
      try {
        await api(`/v1/agent/sessions/${state.activeSessionId}/approvals/${approvalId}/${action}`, { method: "POST" });
        await loadBundle(state.activeSessionId);
      } catch (error) {
        showError(error.message);
      }
    }

    async function exportSession() {
      if (!state.activeSessionId) return;
      try {
        const bundle = await api(`/v1/agent/sessions/${state.activeSessionId}/export`);
        const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `agent-session-${state.activeSessionId}.json`;
        link.click();
        URL.revokeObjectURL(url);
      } catch (error) {
        showError(error.message);
      }
    }

    function isLiveStatus(status) {
      return status === "planning" || status === "researching";
    }

    function stopLiveStream(resetCursor = false) {
      if (state.streamRefreshTimer) {
        clearTimeout(state.streamRefreshTimer);
        state.streamRefreshTimer = null;
      }
      if (state.eventSource) {
        state.eventSource.close();
        state.eventSource = null;
      }
      state.eventSourceSessionId = null;
      if (resetCursor) {
        state.streamCursor = null;
      }
    }

    function scheduleStreamRefresh() {
      if (!state.activeSessionId) return;
      if (state.streamRefreshTimer) {
        clearTimeout(state.streamRefreshTimer);
      }
      state.streamRefreshTimer = setTimeout(async () => {
        state.streamRefreshTimer = null;
        if (!state.activeSessionId) return;
        try {
          await loadBundle(state.activeSessionId, { syncLive: false });
          if (!state.bundle || !isLiveStatus(state.bundle.session.status)) {
            stopLiveStream();
            syncPolling();
          }
        } catch (error) {
          if (/not found/i.test(error.message || "")) {
            stopLiveStream(true);
            state.activeSessionId = null;
            state.bundle = null;
            renderSessions();
            renderAll();
            return;
          }
          stopLiveStream();
          syncPolling();
        }
      }, 250);
    }

    function startLiveStream() {
      if (!state.activeSessionId || typeof window.EventSource === "undefined") return false;
      if (state.eventSource && state.eventSourceSessionId === state.activeSessionId && state.eventSource.readyState !== EventSource.CLOSED) {
        return true;
      }
      stopLiveStream();
      const url = new URL(`/v1/agent/sessions/${encodeURIComponent(state.activeSessionId)}/events/stream`, window.location.origin);
      if (state.streamCursor) {
        url.searchParams.set("after_event_id", state.streamCursor);
      }
      const source = new EventSource(url.toString());
      state.eventSource = source;
      state.eventSourceSessionId = state.activeSessionId;
      source.addEventListener("ready", (event) => {
        try {
          const payload = JSON.parse(event.data || "{}");
          if (payload.after_event_id) {
            state.streamCursor = payload.after_event_id;
          }
        } catch (_) {
          // keep the stream alive even if ready payload is malformed
        }
      });
      source.addEventListener("agent_event", (event) => {
        try {
          const payload = JSON.parse(event.data || "{}");
          if (payload.event_id) {
            state.streamCursor = payload.event_id;
          }
        } catch (_) {
          // ignore parse errors and keep listening
        }
        scheduleStreamRefresh();
      });
      source.addEventListener("heartbeat", (event) => {
        try {
          const payload = JSON.parse(event.data || "{}");
          if (payload.after_event_id) {
            state.streamCursor = payload.after_event_id;
          }
        } catch (_) {
          // heartbeat is best-effort
        }
        scheduleStreamRefresh();
      });
      source.onerror = () => {
        if (source.readyState === EventSource.CLOSED) {
          stopLiveStream();
          syncPolling();
        }
      };
      return true;
    }

    function syncLiveUpdates({ force = false } = {}) {
      const status = state.bundle && state.bundle.session.status;
      const shouldWatch = force || isLiveStatus(status) || Boolean(state.localActivity);
      if (!shouldWatch) {
        stopLiveStream();
        syncPolling();
        return;
      }
      if (typeof window.EventSource !== "undefined") {
        const started = startLiveStream();
        if (started) {
          if (state.pollTimer) {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
          }
          return;
        }
      }
      stopLiveStream();
      syncPolling();
    }

    function syncPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
      const status = state.bundle && state.bundle.session.status;
      if (isLiveStatus(status)) {
        state.pollTimer = setInterval(async () => {
          try {
            await loadBundle(state.activeSessionId);
          } catch (_) {
            clearInterval(state.pollTimer);
            state.pollTimer = null;
          }
        }, 2000);
      }
    }

    function showError(message) {
      if (/not found/i.test(message || "")) {
        state.bundle = null;
        state.activeSessionId = null;
        renderAll();
        return;
      }
      const node = document.createElement("article");
      node.className = "message assistant";
      node.innerHTML = `<header><strong>错误</strong></header><pre class="error">${escapeHtml(message)}</pre>`;
      el.timeline.appendChild(node);
    }

    el.newSessionBtn.addEventListener("click", createSession);
    el.sendBtn.addEventListener("click", sendMessage);
    el.confirmBtn.addEventListener("click", confirmPlan);
    el.exportBtn.addEventListener("click", exportSession);
    el.refreshBtn.addEventListener("click", () => state.activeSessionId ? loadBundle(state.activeSessionId) : loadSessions());
    window.addEventListener("beforeunload", () => stopLiveStream(true));
    el.messageInput.addEventListener("keydown", (event) => {
      if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
        sendMessage();
      }
    });

    api("/health")
      .then(() => {
        el.apiStatus.textContent = "API 正常";
        el.apiStatus.className = "pill good";
      })
      .catch(() => {
        el.apiStatus.textContent = "API 离线";
        el.apiStatus.className = "pill bad";
      });

    loadSessions().catch((error) => showError(error.message));
  </script>
</body>

</html>
