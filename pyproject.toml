[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agentic-research-copilot"
version = "0.1.0"
description = "Clean-room multi-agent research copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "qdrant-client>=1.13",
  "langgraph>=0.2.0,<0.3.0",
  "langgraph-checkpoint-sqlite>=2.0.11,<3.0.0",
]

[project.optional-dependencies]
ai = [
  "langchain>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-community>=0.3.0",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3",
]
queue = [
  "celery[redis]>=5.4",
  "redis>=5.0",
]
documents = [
  "beautifulsoup4>=4.12",
  "pymupdf>=1.25",
]
eval = [
  "datasets>=2.19,<5.0",
  "langchain>=0.3.0,<0.4.0",
  "langchain-community>=0.3.0,<0.4.0",
  "langchain-openai>=0.2.0,<0.3.0",
  "ragas>=0.2.0,<0.3.0",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_research_copilot"]
